<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Culinary Corner - Login</title><link rel="icon" href="images/logo.png"><link rel="icon" href="images/favicon.png"><link rel="stylesheet" href="css/style.css"></head>
<body data-page="login"><header id="nav"></header>
<main class="container narrow"><div class="two">
  <form id="loginForm" class="panel"><h2>Login</h2>
    <label>Email<input id="lemail" type="email" required></label>
    <label>Password<input id="lpass" type="password" required></label>
    <button class="btn">Login</button> <span id="lmsg" class="error"></span></form>
  <form id="regForm" class="panel"><h2>Create account</h2>
    <label>Name<input id="rname" required></label>
    <label>Email<input id="remail" type="email" required></label>
    <label>Password (min 6)<input id="rpass" type="password" minlength="6" required></label>
    <button class="btn">Register</button> <span id="rmsg" class="error"></span></form>
</div></main>
<footer>© 2026 The Culinary Corner · Italian Food · Cook. Share. Savor.</footer><script src="js/main.js"></script></body></html>
